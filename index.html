<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A 10 × 50 grid</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="field" aria-hidden="true"></canvas>

    <main class="stage">
      <p class="kicker">Look first</p>
      <h1>A 10 × 50 grid.</h1>
      <div
        id="grid"
        class="grid"
        role="img"
        aria-label="A grid of 500 glowing white circles, 10 rows by 50 columns."
      ></div>
      <p class="caption">
        50 × 10. Same points. Next workshop they become Turbulence.
      </p>
    </main>

    <script src="grid.js"></script>
  </body>
</html>
